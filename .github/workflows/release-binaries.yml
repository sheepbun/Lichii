name: release-binaries

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the binaries as a GitHub release
        type: boolean
        default: true
  push:
    branches:
      - nx2-experimental
    # A binary only changes when build inputs change; docs-only pushes skip the build.
    paths:
      - "src/**"
      # Test-only changes cannot change a binary: the build configures with BUILD_TESTING=OFF and
      # YUZU_TESTS=OFF below, so a push that only touches src/tests has nothing to rebuild.
      - "!src/tests/**"
      - "CMakeLists.txt"
      - "CMakeModules/**"
      - "externals/**"
      - "dist/**"
      - "tools/**"
      - ".patch/**"
      - "cpmfile.json"
      - "*.profdata"
      - ".github/workflows/release-binaries.yml"

permissions:
  contents: read

# Clang major the Linux PGO build uses, from apt.llvm.org. A profile is written by a current clang
# and an older reader refuses it, so this has to stay at or above whatever produced
# eglantine.profdata; bump it when a refreshed profile needs a newer LLVM.
env:
  PGO_LLVM_VERSION: "23"

# A running build is never cancelled: it finishes and publishes. A push meanwhile queues one build;
# a later push replaces it, so the newest commit builds as soon as the running one is done.
concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Prepare release tag
        if: github.event_name == 'push' || inputs.publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_NUMBER}"
          if tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "Release tag $tag points to $tag_sha instead of $GITHUB_SHA"
              exit 1
            fi
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi

  build:
    name: ${{ matrix.platform }} binary
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      CCACHE_COMPILERCHECK: content
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          # The -pgo build is the same programs compiled by clang against the repo's
          # eglantine.profdata. Eden's profile (Eden-CI/PGO) comes from Switch 1 games: with it Mario
          # Kart World ran at about half the speed of the normal build, with eglantine.profdata at
          # about the same speed.
          - platform: linux-x86_64-pgo
            runner: ubuntu-24.04
            pgo: true

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf cmake g++ gcc git glslang-tools libglu1-mesa-dev \
            libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
            mesa-common-dev nasm ninja-build qt6-base-private-dev \
            qt6-charts-dev qt6-tools-dev libavfilter-dev libavcodec-dev \
            libswscale-dev pkg-config zlib1g-dev libva-dev libvdpau-dev \
            spirv-tools spirv-headers libusb-1.0-0-dev \
            libboost-dev libboost-fiber-dev libboost-context-dev \
            libopus-dev libasound2-dev ccache \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts
          cache: true

      # Ubuntu's own clang 18 cannot read a profile from a current LLVM, so take clang from the LLVM
      # apt repo. The versioned packages are named explicitly: that repo's unversioned clang/lld
      # metapackages can lag the binaries they depend on and then resolve to nothing. lld-23 only
      # ships ld.lld under /usr/lib/llvm-23/bin, so -B points the linker search there.
      - name: Install clang for PGO
        if: matrix.pgo
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$PGO_LLVM_VERSION main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "clang-$PGO_LLVM_VERSION" "lld-$PGO_LLVM_VERSION"
          "clang-$PGO_LLVM_VERSION" --version

      # The profile is in the source tree, where the configure step reads it.
      - name: Check PGO profile
        if: matrix.pgo
        shell: bash
        run: |
          set -euo pipefail
          test -s eglantine.profdata

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpm-${{ matrix.platform }}-v2-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ matrix.platform }}-v2-
            cpm-${{ runner.os }}-

      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: objects-${{ matrix.platform }}-v2-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            objects-${{ matrix.platform }}-v2-${{ github.sha }}-
            objects-${{ matrix.platform }}-v2-

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          flags=(
            -DCMAKE_BUILD_TYPE=Release
            -DBUILD_TESTING=OFF
            -DYUZU_TESTS=OFF
            -DYUZU_CMD=ON
            -DYUZU_ROOM=OFF
            -DYUZU_ROOM_STANDALONE=OFF
            -DYUZU_USE_BUNDLED_QT=OFF
            -DENABLE_QT_TRANSLATION=ON
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"
            -DYUZU_USE_BUNDLED_SDL3=ON
            -DVulkanHeaders_FORCE_BUNDLED=ON
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON
            # Off until Bunx2's own releases are verified: the checker would offer them as updates.
            -DENABLE_UPDATE_CHECKER=OFF
            -DBUNX2_BUILD_TAG=build-${{ github.run_number }}
            -DBUNX2_BUILD_PLATFORM=${{ matrix.platform }}
            -DUSE_DISCORD_PRESENCE=OFF
            -DUSE_CCACHE=ON
          )
          if [ '${{ matrix.pgo }}' = 'true' ]; then
            # Same flags Eden's CI passes for its clang PGO build.
            profile="-fprofile-use=$PWD/eglantine.profdata -Wno-backend-plugin \
              -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
            flags+=(
              "-DCMAKE_C_COMPILER=clang-$PGO_LLVM_VERSION"
              "-DCMAKE_CXX_COMPILER=clang++-$PGO_LLVM_VERSION"
              "-DCMAKE_EXE_LINKER_FLAGS=-B/usr/lib/llvm-$PGO_LLVM_VERSION/bin -fuse-ld=lld"
              "-DCMAKE_C_FLAGS=$profile"
              "-DCMAKE_CXX_FLAGS=$profile"
            )
          fi
          cmake -S . -B build/release -G Ninja "${flags[@]}"

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      - name: Build
        shell: bash
        run: |
          ccache --zero-stats
          cmake --build build/release --target yuzu yuzu-cmd --parallel
          ccache --show-stats

      - name: Save compiler objects
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      # Plain tar.gz with the two programs and switch defaults. GitHub artifacts drop executable
      # bits, so a tar preserves them. This needs Qt 6 and the usual system libraries installed.
      - name: Package Linux tar.gz
        shell: bash
        run: |
          set -euo pipefail
          test -x build/release/bin/bunx2
          test -x build/release/bin/eden-cli
          test -f build/release/bin/libnxformat.so
          strip build/release/bin/bunx2 build/release/bin/eden-cli
          tar -czf "bunx2-${GITHUB_SHA}-${{ matrix.platform }}.tar.gz" \
            -C build/release/bin bunx2 eden-cli nx2_switches.txt libnxformat.so
          ls -la "bunx2-${GITHUB_SHA}-${{ matrix.platform }}.tar.gz"

      # A self-contained AppImage: linuxdeploy bundles every library the two programs need except
      # the base system ones (glibc, X11/Wayland client libraries, the GPU driver and Vulkan loader),
      # and its Qt plugin adds the Qt libraries and platform plugins. Runs on glibc 2.39+ systems.
      - name: Package Linux AppImage
        shell: bash
        run: |
          set -euo pipefail
          test -x build/release/bin/bunx2
          test -x build/release/bin/eden-cli
          tools="$RUNNER_TEMP/linuxdeploy"
          mkdir -p "$tools"
          arch=x86_64
          curl -fsSL -o "$tools/linuxdeploy-$arch.AppImage" \
          https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$arch.AppImage
          curl -fsSL -o "$tools/linuxdeploy-plugin-qt-$arch.AppImage" \
          https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-$arch.AppImage
          chmod +x "$tools"/*.AppImage
          # The desktop file names its icon io.github.sheepbun.bunx2.
          icon="$RUNNER_TEMP/io.github.sheepbun.bunx2.png"
          cp dist/branding/png/bunx2-256.png "$icon"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          # Include Wayland platform plugins and their graphics/shell integrations.
          export EXTRA_QT_MODULES=waylandcompositor
          export EXTRA_PLATFORM_PLUGINS='libqwayland-egl.so;libqwayland-generic.so'
          # Embedded in the AppImage metadata; matches the release tag (build-N) plus the commit.
          export LDAI_VERSION="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          export LDAI_OUTPUT="bunx2-${GITHUB_SHA}-${{ matrix.platform }}.AppImage"
          export OUTPUT="$LDAI_OUTPUT"
          export ARCH="$arch"
          mkdir -p AppDir/usr/bin
          cp build/release/bin/nx2_switches.txt AppDir/usr/bin/
          "$tools/linuxdeploy-$arch.AppImage" --appdir AppDir \
            --executable build/release/bin/bunx2 \
            --executable build/release/bin/eden-cli \
            --desktop-file dist/io.github.sheepbun.bunx2.desktop \
            --icon-file "$icon" \
            --plugin qt \
            --output appimage
          test -s "$LDAI_OUTPUT"
          ls -la "$LDAI_OUTPUT"

      # Both Linux files go in one artifact: the tar.gz and the AppImage.
      - name: Upload Linux binary
        uses: actions/upload-artifact@v7
        with:
          name: bunx2-${{ matrix.platform }}-${{ github.sha }}
          path: |
            bunx2-${{ github.sha }}-${{ matrix.platform }}.tar.gz
            bunx2-${{ github.sha }}-${{ matrix.platform }}.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # Publishes both Linux builds as a GitHub pre-release once they built: on pushes to
  # nx2-experimental, and on manual runs unless "Publish the binaries as a GitHub release" is
  # unticked.
  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' || inputs.publish_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          pattern: bunx2-*-${{ github.sha }}
          path: artifacts

      - name: Package release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          # Asset names drop the commit sha: the release tag already identifies the build, and
          # stable names let the notes table link to them.
          strip_sha() { sed "s/-${GITHUB_SHA}//" <<< "$1"; }
          for artifact in artifacts/*/; do
            for file in "$artifact"*.AppImage "$artifact"*.tar.gz; do
              cp "$file" "dist/$(strip_sha "$(basename "$file")")"
            done
          done
          ls -la dist

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/build-${GITHUB_RUN_NUMBER}" --jq '.object.sha')
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "Release tag build-${GITHUB_RUN_NUMBER} points to $tag_sha instead of $GITHUB_SHA"
            exit 1
          fi
          tag="build-${GITHUB_RUN_NUMBER}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"

          link() { [[ -e "dist/$2" ]] && echo "[$1](${base}/$2)" || true; }
          appimage_tar() {
            local appimage tar
            appimage=$(link AppImage "$1.AppImage")
            tar=$(link tar.gz "$1.tar.gz")
            echo "${appimage}${appimage:+${tar:+ · }}${tar}"
          }
          has_pgo=$(compgen -G 'dist/*-pgo.*' || true)
          row() {
            [[ -z "$2$3" ]] && return 0
            if [[ -n "$has_pgo" ]]; then echo "| $1 | $2 | $3 | $4 |"; else echo "| $1 | $2 | $4 |"; fi
          }
          table() {
            local rows
            rows=$(cat)
            [[ -z "$rows" ]] && return 0
            if [[ -n "$has_pgo" ]]; then
              printf '| Build Type | Standard | PGO (Recommended) | Notes |\n| --- | --- | --- | --- |\n'
            else
              printf '| Build Type | Standard | Notes |\n| --- | --- | --- |\n'
            fi
            echo "$rows"
          }
          pgo_note=""
          if [[ -n "$has_pgo" ]]; then
            pgo_note="The PGO builds are the same programs compiled by clang with profile-guided optimization, using Eglantine's profile. Prefer them when your CPU supports it."
          fi

          cat > notes.md <<EOF
          Automatic build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}.

          ## Linux

          Linux packages come as an AppImage (self-contained, needs glibc 2.39 or newer: Ubuntu 24.04, Fedora 40, Debian 13, Arch) and a tar.gz (uses your system libraries, so Qt 6 and the usual libraries must be installed).

          $({
            row amd64 "$(appimage_tar bunx2-linux-x86_64)" "$(appimage_tar bunx2-linux-x86_64-pgo)" "Make the AppImage executable (\`chmod +x\`) and run it"
          } | table)

          ${pgo_note}
          EOF

          gh release create "${tag}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --prerelease \
            --title "Bunx2 ${GITHUB_REF_NAME} build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes-file notes.md

      # BUNX2_BUILD_TAG is baked into every binary as build-<run number>, and the update checker
      # compares release tags against it. A release whose tag or title names another run would be
      # skipped or offered wrongly, so fail the run instead of leaving it published.
      - name: Verify the release tag matches the run number
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="build-${GITHUB_RUN_NUMBER}"
          published_tag=$(gh release view "$expected" --repo "${GITHUB_REPOSITORY}" --json tagName --jq '.tagName')
          published_title=$(gh release view "$expected" --repo "${GITHUB_REPOSITORY}" --json name --jq '.name')
          if [ "$published_tag" != "$expected" ] || [[ "$published_title" != *" build ${GITHUB_RUN_NUMBER} ("* ]]; then
            echo "Release is tagged '$published_tag' and titled '$published_title', expected tag $expected and a title naming build ${GITHUB_RUN_NUMBER}"
            exit 1
          fi
